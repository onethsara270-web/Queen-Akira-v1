<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Channel Boost - Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; color: #e0e0e0; padding: 20px; min-height: 100vh; }
  .container { max-width: 700px; margin: 0 auto; padding-bottom: 50px; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #2a2a4a; padding-bottom: 16px; }
  h1 { font-size: 24px; color: #8b5cf6; display: flex; align-items: center; gap: 10px; }
  .back-btn { background: #1a1a2e; color: #a0a0c0; text-decoration: none; padding: 8px 16px; border-radius: 6px; border: 1px solid #2a2a4a; font-size: 14px; }
  .back-btn:hover { background: #2a2a4a; color: #fff; }

  .card { background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #2a2a4a; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  
  label { display: block; margin-bottom: 8px; font-size: 13px; color: #a0a0c0; font-weight: 600; }
  input, select { width: 100%; padding: 12px; background: #0f0f1f; border: 1px solid #2a2a4a; border-radius: 8px; color: #e0e0e0; margin-bottom: 16px; font-size: 14px; outline: none; transition: 0.2s; }
  input:focus, select:focus { border-color: #8b5cf6; }
  
  button { width: 100%; padding: 14px; background: linear-gradient(135deg, #8b5cf6, #6366f1); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; font-size: 15px; transition: 0.2s; }
  button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 12px; background: #0f0f1f; border: 1px solid #2a2a4a; border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; font-weight: 600; color: #a0a0c0; transition: 0.2s; }
  .tab.active { background: #8b5cf6; border-color: #8b5cf6; color: #fff; }

  .status-box { padding: 16px; background: #0f0f1f; border-radius: 8px; margin-top: 16px; font-size: 14px; display: none; line-height: 1.5; }
  .status-box.ok { border-left: 4px solid #10b981; display: block; }
  .status-box.err { border-left: 4px solid #ef4444; display: block; }
  
  .session-info { display: flex; align-items: center; gap: 10px; font-size: 14px; background: #0f0f1f; padding: 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #2a2a4a; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981; }
  .dot.off { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

  .boost-list { max-height: 300px; overflow-y: auto; padding-right: 5px; }
  .boost-item { padding: 12px; background: #0f0f1f; border-radius: 8px; margin-bottom: 10px; font-size: 13px; border: 1px solid #2a2a4a; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 8px; }
  .badge.active { background: rgba(16, 185, 129, 0.2); color: #10b981; }
  .badge.reverted { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0f0f1f; }
  ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🚀 Channel Boost</h1>
    <a href="/panel" class="back-btn">← Back to Panel</a>
  </div>

  <div class="card">
    <div class="session-info" id="sessionInfo">
      <div class="dot off" id="statusDot"></div>
      <span id="sessionText">Loading connected bots...</span>
    </div>
    <label>Select Bot (Requester)</label>
    <select id="sessionSelect" onchange="onSessionChange()">
      <option value="">-- No bots connected --</option>
    </select>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab active" data-type="follow" onclick="switchTab('follow')">👥 Followers</div>
      <div class="tab" data-type="react" onclick="switchTab('react')">❤️ Reactions</div>
      <div class="tab" data-type="poll" onclick="switchTab('poll')">📊 Poll Votes</div>
    </div>

    <!-- FOLLOW FORM -->
    <div id="formFollow">
      <label>Channel Link</label>
      <input type="text" id="followLink" placeholder="https://whatsapp.com/channel/0029...">
      <p style="font-size: 12px; color: #a0a0c0; margin-top: -10px; margin-bottom: 16px;">All connected bots will follow this channel.</p>
      <button onclick="submitBoost('follow')" id="btnFollow">Boost Followers</button>
    </div>

    <!-- REACT FORM -->
    <div id="formReact" style="display:none">
      <label>Channel Post URL (Must include Post ID)</label>
      <input type="text" id="reactLink" placeholder="https://whatsapp.com/channel/0029.../123456789">
      <label>Reaction Emoji</label>
      <input type="text" id="reactEmoji" placeholder="❤️" value="❤️">
      <button onclick="submitBoost('react')" id="btnReact">Boost Reactions</button>
    </div>

    <!-- POLL FORM -->
    <div id="formPoll" style="display:none">
      <label>Channel Poll Post URL (Must include Post ID)</label>
      <input type="text" id="pollLink" placeholder="https://whatsapp.com/channel/0029.../123456789">
      <label>Poll Option to Vote</label>
      <input type="text" id="pollOption" placeholder="Option Name (e.g. Blue)">
      <button onclick="submitBoost('poll')" id="btnPoll">Boost Poll Votes</button>
    </div>

    <div id="statusBox" class="status-box"></div>
  </div>

  <div class="card">
    <h3 style="font-size: 16px; margin-bottom: 16px; color: #8b5cf6;">📋 Recent Boosts</h3>
    <div class="boost-list" id="boostList">
      <div style="color: #a0a0c0; font-size: 13px;">Loading...</div>
    </div>
  </div>
</div>

<script>
let currentSessionId = null;

// Load Sessions on page load
async function loadSessions() {
  try {
    const res = await fetch('/api/boost/sessions');
    const data = await res.json();
    
    const select = document.getElementById('sessionSelect');
    select.innerHTML = '';
    
    if (!data.success || !data.sessions || data.sessions.length === 0) {
      document.getElementById('sessionInfo').innerHTML = '<div class="dot off"></div><span style="color:#ef4444">No connected bots available. Please connect a bot first.</span>';
      select.innerHTML = '<option value="">-- No bots connected --</option>';
      return;
    }

    document.getElementById('sessionInfo').innerHTML = `<div class="dot"></div><span style="color:#10b981">${data.sessions.length} Bot(s) connected and ready to boost.</span>`;
    
    data.sessions.forEach(sess => {
      const isOwner = sess.sessionId === '__owner__';
      const label = isOwner ? `Owner Bot (+${sess.phone})` : `User Bot (+${sess.phone})`;
      const opt = document.createElement('option');
      opt.value = sess.sessionId;
      opt.textContent = label;
      select.appendChild(opt);
    });

    // Auto select first session
    if (data.sessions.length > 0) {
      currentSessionId = data.sessions[0].sessionId;
      select.value = currentSessionId;
      loadBoosts();
    }
  } catch (err) {
    console.error(err);
  }
}

function onSessionChange() {
  currentSessionId = document.getElementById('sessionSelect').value;
  loadBoosts();
}

function switchTab(type) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-type="${type}"]`).classList.add('active');
  
  document.getElementById('formFollow').style.display = type === 'follow' ? 'block' : 'none';
  document.getElementById('formReact').style.display = type === 'react' ? 'block' : 'none';
  document.getElementById('formPoll').style.display = type === 'poll' ? 'block' : 'none';
  
  document.getElementById('statusBox').style.display = 'none';
}

// Submit Boost
async function submitBoost(type) {
  if (!currentSessionId) {
    alert("Please connect a bot first!");
    return;
  }

  const btn = document.getElementById(`btn${type.charAt(0).toUpperCase() + type.slice(1)}`);
  const statusBox = document.getElementById('statusBox');
  
  btn.disabled = true;
  btn.textContent = "Processing... (This may take a minute)";
  statusBox.className = 'status-box';
  statusBox.style.display = 'none';

  try {
    let url = `/api/boost/${type}`;
    let body = { requesterSessionId: currentSessionId };

    if (type === 'follow') {
      body.channelLink = document.getElementById('followLink').value;
    } else if (type === 'react') {
      body.channelLink = document.getElementById('reactLink').value;
      body.emoji = document.getElementById('reactEmoji').value || '❤️';
    } else if (type === 'poll') {
      body.channelLink = document.getElementById('pollLink').value;
      body.pollOption = document.getElementById('pollOption').value;
    }

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (data.success) {
      statusBox.className = 'status-box ok';
      statusBox.innerHTML = `
        <b>✅ Boost Successful!</b><br>
        Channel: ${data.channelName || 'Unknown'}<br>
        Successful: <b>${data.successful}/${data.total}</b> bots<br>
        Failed: <b>${data.failed}</b> bots
        ${data.errors && data.errors.length > 0 ? `<br><br><span style="color:#ef4444; font-size:12px">Errors: ${data.errors.join('<br>')}</span>` : ''}
      `;
      loadBoosts();
    } else {
      throw new Error(data.error || 'Unknown error occurred');
    }
  } catch (error) {
    statusBox.className = 'status-box err';
    statusBox.innerHTML = `<b>❌ Error:</b> ${error.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = `Boost ${type.charAt(0).toUpperCase() + type.slice(1)}`;
  }
}

// Load Boost History
async function loadBoosts() {
  if (!currentSessionId) return;
  const listEl = document.getElementById('boostList');
  
  try {
    const res = await fetch(`/api/boost/list?requesterSessionId=${encodeURIComponent(currentSessionId)}`);
    const data = await res.json();
    
    if (!data.success || !data.boosts || data.boosts.length === 0) {
      listEl.innerHTML = '<div style="color: #a0a0c0; font-size: 13px; text-align:center;">No boosts yet.</div>';
      return;
    }

    listEl.innerHTML = data.boosts.map(b => {
      const emoji = { follow: '👥', react: '❤️', poll: '📊' }[b.actionType] || '🚀';
      const okCount = b.participants.filter(p => p.status === 'done').length;
      const date = new Date(b.createdAt).toLocaleString();
      
      return `
        <div class="boost-item">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <b>${emoji} ${b.actionType.toUpperCase()}</b>
            <span class="badge ${b.status}">${b.status}</span>
          </div>
          <div style="color: #a0a0c0; margin-bottom: 4px;">Channel: ${b.channelName || b.channelJid.substring(0, 15)}...</div>
          <div style="display:flex; justify-content:space-between;">
            <span>Bots: <b>${okCount}/${b.participants.length}</b> done</span>
            <span style="font-size: 11px; color: #666;">${date}</span>
          </div>
        </div>
      `;
    }).join('');
  } catch (err) {
    listEl.innerHTML = '<div style="color: #ef4444; font-size: 13px;">Failed to load history.</div>';
  }
}

// Init
loadSessions();
setInterval(loadSessions, 30000); // Auto refresh every 30s
</script>
</body>
</html>
