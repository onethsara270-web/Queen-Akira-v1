<!DOCTYPE html><html><head><title>Login — QUEEN ZARA MINI</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<style>
.wrapper{max-width:420px}
.help-box{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:20px 22px;margin-top:20px;text-align:left;
}
.help-box h4{
  color:var(--accent);
  font-size:0.76em;margin-bottom:10px;
  letter-spacing:2px;text-transform:uppercase;
  font-weight:800;display:flex;align-items:center;gap:6px;
  font-family:'JetBrains Mono',monospace;
}
.help-box ul{list-style:none;padding:0;margin:0}
.help-box li{
  color:var(--text-mid);font-size:0.8em;line-height:1.8;
  padding-left:22px;position:relative;margin-bottom:6px;
  font-family:'JetBrains Mono',monospace;
}
.help-box li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-weight:900}
.help-box li strong{
  color:var(--accent);
  background:var(--accent-glow);
  padding:1px 6px;border-radius:4px;
  border:1px solid rgba(212,255,0,0.2);
}

.login-btn{
  position:relative;width:100%;
  padding:16px 22px;margin-top:6px;
  border:none;border-radius:var(--radius-sm);
  color:var(--bg);
  font-family:'JetBrains Mono',monospace;
  font-size:0.88em;font-weight:900;
  letter-spacing:2px;text-transform:uppercase;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  overflow:hidden;
  transition:all 0.35s cubic-bezier(0.2,0.9,0.3,1);
  background:var(--accent);
  box-shadow:0 0 0 1px var(--accent),0 12px 35px var(--accent-glow);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
.login-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
  transform:skewX(-20deg);transition:left 0.7s;pointer-events:none;
}
.login-btn:hover::before{left:150%}
.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 0 1px var(--accent),0 18px 45px var(--accent-glow-strong);
}
.login-btn:active{transform:translateY(0) scale(0.985)}
.login-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}

.login-btn .ico{font-size:1.1em;filter:drop-shadow(0 0 8px rgba(0,0,0,0.3));position:relative;z-index:1}
.login-btn #btnText{position:relative;z-index:1}
.login-btn .loader{
  display:none;width:18px;height:18px;
  border:2.5px solid rgba(0,0,0,0.15);
  border-top-color:var(--bg);border-radius:50%;
  animation:spin 0.7s linear infinite;position:relative;z-index:1;
}

.deploy-link{padding:14px !important;font-size:0.84em !important;border-radius:var(--radius-sm) !important;}

@media(max-width:640px){
  .login-btn{padding:15px 18px;font-size:0.84em;letter-spacing:1.5px;}
}
</style></head>
<body>
<div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
<div class="wrapper">
  <div class="glass-card">
    <div class="emoji-logo" style="width:90px;height:90px;font-size:3em;margin-bottom:20px;border-radius:16px">🔐</div>
    <h1 class="logo-text" style="font-size:1.9em">QUEEN ZARA MINI</h1>
    <div class="subtitle" style="margin-bottom:24px">Access Panel</div>
    <div id="error" class="error"></div>
    <form id="form" onsubmit="return handleLogin(event)">
      <div class="input-group" style="margin-bottom:14px">
        <label>🔑 Your Password</label>
        <input type="tel" id="pass" class="pw-input" placeholder="•••••" maxlength="20" inputmode="numeric" autocomplete="off" autofocus>
      </div>
      <button type="submit" class="login-btn" id="btn">
        <span class="ico" id="btnIcon">→</span>
        <span id="btnText">Enter Dashboard</span>
        <div class="loader" id="loader"></div>
      </button>
    </form>
    <div class="footer" style="margin-top:18px">✨ Powered by <span>FIXO DEV</span> 🖤</div>
  </div>
  <div class="divider" style="margin:20px 0 16px">OR</div>
  <a href="/freebot" class="deploy-link">
    <span style="font-size:1.2em">🚀</span>
    <span>Deploy Your Free Bot</span>
  </a>
  <div class="help-box">
    <h4>💡 Need your password?</h4>
    <ul>
      <li>Send <strong>.password</strong> to your bot</li>
      <li>You'll get a 5-digit password</li>
      <li>Use it here to login</li>
      <li>Each bot has its own password</li>
    </ul>
  </div>
</div>
<script>
async function handleLogin(e){
  e.preventDefault();
  const pass = document.getElementById('pass').value.trim();
  const btn = document.getElementById('btn');
  const btnText = document.getElementById('btnText');
  const btnIcon = document.getElementById('btnIcon');
  const loader = document.getElementById('loader');
  const error = document.getElementById('error');
  error.classList.remove('show');
  if(!pass){error.textContent='⚠️ Enter your password';error.classList.add('show');return false}
  btn.disabled=true;btnText.style.display='none';btnIcon.style.display='none';loader.style.display='block';
  try {
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
    const d = await r.json();
    if(d.success){
      if(d.type === 'owner') window.location.href='/dashboard?key='+encodeURIComponent(pass);
      else window.location.href='/user/settings?key='+encodeURIComponent(pass);
      return false;
    }
    error.textContent='❌ ' + (d.error || 'Wrong password!');
    error.classList.add('show');
  } catch(err){
    error.textContent='❌ Connection error';
    error.classList.add('show');
  }
  btn.disabled=false;btnText.style.display='inline';btnIcon.style.display='inline';loader.style.display='none';
  document.getElementById('pass').value='';document.getElementById('pass').focus();
  return false;
}
document.getElementById('pass').addEventListener('input', function(){
  this.value = this.value.replace(/[^0-9a-zA-Z]/g, '').slice(0, 20);
});
</script>
</body></html>
