<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<title>Login — QUEEN ZARA MINI</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<script>const savedTheme = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-theme', savedTheme);</script>
<style>
.wrapper{max-width:400px}
.help-box{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:20px;text-align:left}
.help-box h4{color:var(--accent);font-size:0.75em;margin-bottom:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:6px;font-family:var(--font-mono)}
.help-box ul{list-style:none;padding:0;margin:0}
.help-box li{color:var(--text-mid);font-size:0.8em;line-height:1.6;padding-left:20px;position:relative;margin-bottom:6px;font-family:var(--font-mono)}
.help-box li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-weight:700}
.help-box li strong{color:var(--accent);background:var(--accent-glow);padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="wrapper" style="position:relative;z-index:1">
  <div class="glass-card">
    <div class="emoji-logo"><svg class="icon" style="width:40px;height:40px;" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1 class="logo-text">QUEEN ZARA MINI</h1>
    <div class="subtitle" style="margin-bottom:24px">Access Panel</div>
    
    <button class="theme-btn" onclick="toggleTheme()" style="position:absolute;top:20px;right:20px"><svg class="icon sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="icon moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>

    <div id="error" class="error"></div>
    <form id="form" onsubmit="return handleLogin(event)">
      <div class="input-group" style="margin-bottom:16px">
        <label><svg class="icon" viewBox="0 0 24 24" style="margin-bottom:-3px;margin-right:4px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Your Password</label>
        <input type="tel" id="pass" class="pw-input" placeholder="•••••" maxlength="20" inputmode="numeric" autocomplete="off" autofocus>
      </div>
      <button type="submit" class="login-btn" id="btn">
        <span id="btnText">Enter Dashboard</span>
        <div class="spinner" id="loader" style="display:none;margin:0"></div>
      </button>
    </form>
    <div class="footer" style="margin-top:18px">✨ Powered by <span>FIXO DEV</span> 🖤</div>
  </div>
  
  <div class="divider">OR</div>
  <a href="/freebot" class="deploy-link">
    <svg class="icon" viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
    Deploy Your Free Bot
  </a>
  
  <div class="help-box">
    <h4><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Need your password?</h4>
    <ul>
      <li>Send <strong>.password</strong> to your bot</li>
      <li>You'll get a 5-digit password</li>
      <li>Use it here to login</li>
    </ul>
  </div>
</div>
<script>
async function handleLogin(e){
  e.preventDefault();
  const pass = document.getElementById('pass').value.trim();
  const btn = document.getElementById('btn'); const btnText = document.getElementById('btnText');
  const loader = document.getElementById('loader'); const error = document.getElementById('error');
  error.classList.remove('show');
  if(!pass){error.textContent='⚠️ Enter your password';error.classList.add('show');return false}
  btn.disabled=true;btnText.style.display='none';loader.style.display='inline-block';
  try {
    const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
    const d = await r.json();
    if(d.success){
      if(d.type === 'owner') window.location.href='/dashboard?key='+encodeURIComponent(pass);
      else window.location.href='/user/settings?key='+encodeURIComponent(pass);
      return false;
    }
    error.textContent='❌ ' + (d.error || 'Wrong password!'); error.classList.add('show');
  } catch(err) { error.textContent='❌ Connection error'; error.classList.add('show'); }
  btn.disabled=false;btnText.style.display='inline';loader.style.display='none';
  document.getElementById('pass').value='';document.getElementById('pass').focus();
  return false;
}
document.getElementById('pass').addEventListener('input', function(){ this.value = this.value.replace(/[^0-9a-zA-Z]/g, '').slice(0, 20); });
function toggleTheme() { const root = document.documentElement; const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; root.setAttribute('data-theme', next); localStorage.setItem('theme', next); }
</script>
</body></html>
