<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<title>Settings — QUEEN ZARA MINI</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared.css">
<script>const savedTheme = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-theme', savedTheme);</script>
<script>
// ── Auth guard ──
(function() {
  const urlKey = new URLSearchParams(window.location.search).get('key');
  if (urlKey) return;
  const savedKey = localStorage.getItem('qz_auth_key');
  if (savedKey) {
    window.location.replace('/settings?key=' + encodeURIComponent(savedKey));
  } else {
    window.location.href = '/login';
  }
})();
</script>
<style>
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
@media(max-width:640px){.actions{grid-template-columns:1fr}}
#config-container .card{margin-bottom:16px}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<div class="container">
  <div class="header">
    <div class="brand">
      <div class="mini-logo"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
      <div style="font-size:1.2em;font-weight:800;color:var(--text);font-family:var(--font-display)">Owner Settings</div>
    </div>
    <div class="nav">
      <a href="/dashboard?key={{KEY}}">Dashboard</a>
      <a href="/settings?key={{KEY}}" class="active">Settings</a>
      <a href="/login">Logout</a>
      <button class="theme-btn" onclick="toggleTheme()"><svg class="icon sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="icon moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    </div>
  </div>

  <div id="config-container">
    <div class="card" style="text-align:center;padding:40px"><span class="loading"></span> Loading config...</div>
  </div>

  <div class="card" id="antilink-card">
    <h3>Antilink Control</h3>
    <div class="field"><div class="toggle"><span class="toggle-label">Enable Antilink</span><label class="switch"><input type="checkbox" id="al-enabled"><span class="slider"></span></label></div></div>
    <div class="field"><label>Action when link is caught</label><select id="al-action"><option value="delete">Delete only</option><option value="warn">Warn + Delete (kick after limit)</option><option value="kick">Kick instantly</option></select></div>
    <div class="field"><label>Warn limit (before auto-kick)</label><input type="number" id="al-limit" min="1" max="10" value="3"></div>
    <div class="field"><div class="toggle"><span class="toggle-label">Enable Whitelist</span><label class="switch"><input type="checkbox" id="al-whitelist-enabled"><span class="slider"></span></label></div></div>
    <div class="field"><label>Whitelist domains</label><textarea id="al-whitelist" placeholder="whatsapp.com,youtube.com,github.com" style="min-height:80px"></textarea></div>
    <div class="field"><div class="toggle"><span class="toggle-label">Notify user after delete</span><label class="switch"><input type="checkbox" id="al-notify"><span class="slider"></span></label></div></div>
    <div class="field"><div class="toggle"><span class="toggle-label">Skip group admins</span><label class="switch"><input type="checkbox" id="al-skipadmins"><span class="slider"></span></label></div></div>
    <div class="field"><div class="toggle"><span class="toggle-label">Skip bot's own messages</span><label class="switch"><input type="checkbox" id="al-skipbot"><span class="slider"></span></label></div></div>

    <div style="margin-top:16px;padding:16px;background:var(--surface2);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:0.9em;border:1px solid var(--border)">
      <div style="margin-bottom:10px;display:flex;justify-content:space-between"><span style="color:var(--text-dim)">Status</span><span id="al-status">--</span></div>
      <div style="margin-bottom:10px;display:flex;justify-content:space-between"><span style="color:var(--text-dim)">Action</span><span id="al-action-status">--</span></div>
      <div style="margin-bottom:10px;display:flex;justify-content:space-between"><span style="color:var(--text-dim)">Warn limit</span><span id="al-limit-status">--</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-dim)">Whitelist</span><span id="al-whitelist-status">--</span></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
      <button class="btn sm green" onclick="alQuick('on')">Turn ON</button>
      <button class="btn sm danger" onclick="alQuick('off')">Turn OFF</button>
    </div>
    <button class="btn sm green" id="alSaveBtn" onclick="saveAntilink()" style="width:100%;margin-top:12px"><span id="alSaveLabel">Save Antilink</span></button>
  </div>

  <div class="card">
    <h3>Anti-Delete Control</h3>
    <div class="field"><div class="toggle"><span class="toggle-label">Direct Messages</span><label class="switch"><input type="checkbox" id="ad-dm" onchange="toggleAD('dm')"><span class="slider"></span></label></div></div>
    <div class="field"><div class="toggle"><span class="toggle-label">Group Chats</span><label class="switch"><input type="checkbox" id="ad-gc" onchange="toggleAD('gc')"><span class="slider"></span></label></div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
      <button class="btn sm green" onclick="adAction('set_all')">All ON</button>
      <button class="btn sm danger" onclick="adAction('off_all')">All OFF</button>
    </div>
    <div style="margin-top:16px;padding:16px;background:var(--surface2);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:0.9em;border:1px solid var(--border)">
      <div style="margin-bottom:10px;display:flex;justify-content:space-between"><span style="color:var(--text-dim)">DM</span><span id="ad-dm-status">--</span></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-dim)">GC</span><span id="ad-gc-status">--</span></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn sm cyan" onclick="restartBot()" id="restartBtn"><span id="restartLabel">Restart</span></button>
    <button class="btn sm purple" onclick="restoreBackup()" id="undoBtn"><span id="undoLabel">Undo</span></button>
    <button class="btn sm danger" onclick="factoryReset()" id="resetBtn"><span id="resetLabel">Reset</span></button>
    <button class="btn sm green" id="saveBtn" onclick="saveConfig()"><span id="saveLabel">Save & Apply</span></button>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const KEY = '{{KEY}}'; let currentConfig = {};
function toast(msg, type='success') { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + type + ' show'; setTimeout(() => t.classList.remove('show'), 3200); }

async function loadConfig() {
  try {
    const r = await fetch('/api/config?key=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    currentConfig = d.config; renderForm(d.config);
  } catch (e) {
    document.getElementById('config-container').innerHTML =
      '<div class="card" style="color:var(--danger);text-align:center;padding:40px">❌ ' + e.message + '</div>';
  }
}
function isBool(val) { return val === 'true' || val === 'false'; }

function renderForm(cfg) {
  const groups = {
    'Bot Settings': ['PREFIX', 'MODE', 'BUTTON', 'BOT_NAME', 'STICKER_NAME', 'OWNER_NAME', 'OWNER_NUMBER', 'BOT_DOMAIN', 'DEV', 'DESCRIPTION'],
    'Alive Settings': ['ALIVE_IMG', 'LIVE_MSG'],
    'Channels': ['NEWSLETTER_JID', 'NEWSLETTER_NAME', 'CHANNEL_LINK', 'CHANNEL_LINKS', 'GROUP_LINK'],
    'Reaction Settings': ['AUTO_REACT', 'CUSTOM_REACT', 'CUSTOM_REACT_EMOJIS'],
    'Status Settings': ['AUTO_STATUS_SEEN', 'AUTO_STATUS_REACT', 'AUTO_STATUS_REPLY', 'AUTO_STATUS_MSG', 'STATUS_REACT_MODE', 'CUSTOM_STATUS_EMOJI', 'CUSTOM_STATUS_EMOJIS'],
    'Auto AI': ['AUTO_AI', 'AUTO_AI_COOLDOWN', 'AUTO_AI_GROUPS', 'AUTO_AI_DMS'],
    'Automation': ['READ_MESSAGE', 'READ_CMD', 'AUTO_VOICE', 'AUTO_STICKER', 'AUTO_REPLY', 'AUTO_TYPING', 'AUTO_RECORDING', 'ALWAYS_ONLINE', 'ANTI_VV'],
    'Mode': ['PUBLIC_MODE']
  };
  let html = ''; let idx = 0;
  for (const [title, fields] of Object.entries(groups)) {
    html += '<div class="card" style="animation-delay:' + (idx * 0.04) + 's"><h3>' + title + '</h3>';
    for (const f of fields) {
      if (!(f in cfg)) continue;
      const val = String(cfg[f]); const label = f.replace(/_/g, ' ').toLowerCase();

      // ⭐ BOT_DOMAIN gets special placeholder
      if (f === 'BOT_DOMAIN') {
        html += '<div class="field"><label>' + label + '</label>' +
          '<input type="url" data-key="' + f + '" value="' + (val || '') + '" ' +
          'placeholder="https://your-new-domain.com" autocomplete="off">' +
          '<small style="display:block;margin-top:6px;color:var(--text-dim);font-size:0.8em">' +
          'Public URL used in .password command and dashboard links. Leave empty to auto-detect.' +
          '</small></div>';
        continue;
      }

      if (isBool(val)) html += '<div class="field"><div class="toggle"><span class="toggle-label">' + label + '</span><label class="switch"><input type="checkbox" data-key="' + f + '" ' + (val === 'true' ? 'checked' : '') + '><span class="slider"></span></label></div></div>';
      else if (f === 'MODE') html += '<div class="field"><label>' + label + '</label><select data-key="' + f + '"><option value="public" ' + (val === 'public' ? 'selected' : '') + '>public</option><option value="private" ' + (val === 'private' ? 'selected' : '') + '>private</option><option value="inbox" ' + (val === 'inbox' ? 'selected' : '') + '>inbox</option><option value="groups" ' + (val === 'groups' ? 'selected' : '') + '>groups</option></select></div>';
      else if (f === 'STATUS_REACT_MODE') html += '<div class="field"><label>' + label + '</label><select data-key="' + f + '"><option value="default" ' + (val === 'default' ? 'selected' : '') + '>default</option><option value="custom" ' + (val === 'custom' ? 'selected' : '') + '>custom</option><option value="random" ' + (val === 'random' ? 'selected' : '') + '>random</option></select></div>';
      else if (f === 'DESCRIPTION' || f === 'AUTO_STATUS_MSG' || f === 'LIVE_MSG') html += '<div class="field"><label>' + label + '</label><textarea data-key="' + f + '">' + (val || '') + '</textarea></div>';
      else html += '<div class="field"><label>' + label + '</label><input type="text" data-key="' + f + '" value="' + (val || '') + '"></div>';
    }
    html += '</div>'; idx++;
  }
  document.getElementById('config-container').innerHTML = html || '<div class="card" style="text-align:center;padding:40px">No settings available</div>';
}

// ⭐ FIX: include { key, config } in body
async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  const label = document.getElementById('saveLabel');
  btn.disabled = true; label.innerHTML = '<span class="loading"></span>Saving...';
  try {
    const payload = {};
    document.querySelectorAll('#config-container [data-key]').forEach(el => {
      payload[el.dataset.key] = el.type === 'checkbox' ? String(el.checked) : el.value;
    });
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY, config: payload })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    toast('✅ Saved & applied'); loadConfig();
  } catch (e) { toast('❌ ' + e.message, 'error'); }
  finally { btn.disabled = false; label.textContent = 'Save & Apply'; }
}

// ⭐ FIX: correct endpoint + body
async function restartBot() {
  try {
    const r = await fetch('/api/restart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    toast('🔄 Restarting bot...');
  } catch (e) { toast('❌ ' + e.message, 'error'); }
}

// ⭐ FIX: /api/config/restore -> /api/config/undo, add body
async function restoreBackup() {
  if (!confirm('Restore previous backup?')) return;
  try {
    const r = await fetch('/api/config/undo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    toast('↩️ Backup restored'); loadConfig();
  } catch (e) { toast('❌ ' + e.message, 'error'); }
}

// ⭐ FIX: include { key } in body
async function factoryReset() {
  if (!confirm('⚠️ This will reset ALL settings. Continue?')) return;
  try {
    const r = await fetch('/api/config/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    toast('🗑️ Reset done'); loadConfig();
  } catch (e) { toast('❌ ' + e.message, 'error'); }
}

// ⭐ FIX: backend returns flat { enabled, action, whitelist (string), ... } not nested .settings
async function loadAntilink() {
  try {
    const r = await fetch('/api/antilink?key=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (!d.success) return;
    document.getElementById('al-enabled').checked = !!d.enabled;
    document.getElementById('al-action').value = d.action || 'delete';
    document.getElementById('al-limit').value = d.warnLimit || 3;
    document.getElementById('al-whitelist-enabled').checked = !!d.whitelistEnabled;
    document.getElementById('al-whitelist').value = typeof d.whitelist === 'string' ? d.whitelist : '';
    document.getElementById('al-notify').checked = !!d.notify;
    document.getElementById('al-skipadmins').checked = !!d.skipAdmins;
    document.getElementById('al-skipbot').checked = !!d.skipBot;
    document.getElementById('al-status').textContent = d.enabled ? 'ON' : 'OFF';
    document.getElementById('al-action-status').textContent = d.action || 'delete';
    document.getElementById('al-limit-status').textContent = d.warnLimit || 3;
    document.getElementById('al-whitelist-status').textContent =
      d.whitelistEnabled ? (d.whitelist || '') : 'disabled';
  } catch (e) {}
}

// ⭐ FIX: include key, send whitelist as raw string
async function saveAntilink() {
  try {
    const payload = {
      key: KEY,
      enabled: document.getElementById('al-enabled').checked,
      action: document.getElementById('al-action').value,
      warnLimit: parseInt(document.getElementById('al-limit').value, 10) || 3,
      whitelistEnabled: document.getElementById('al-whitelist-enabled').checked,
      whitelist: document.getElementById('al-whitelist').value,
      notify: document.getElementById('al-notify').checked,
      skipAdmins: document.getElementById('al-skipadmins').checked,
      skipBot: document.getElementById('al-skipbot').checked
    };
    const r = await fetch('/api/antilink', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    toast('✅ Antilink saved'); loadAntilink();
  } catch (e) { toast('❌ ' + e.message, 'error'); }
}

async function alQuick(mode) {
  document.getElementById('al-enabled').checked = (mode === 'on');
  await saveAntilink();
}

// ⭐ FIX: backend expects { key, action: 'toggle_dm'|'toggle_gc' }
async function toggleAD(scope) {
  try {
    const action = 'toggle_' + scope;
    const r = await fetch('/api/antidelete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY, action })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    document.getElementById('ad-dm').checked = !!d.dm;
    document.getElementById('ad-gc').checked = !!d.gc;
    document.getElementById('ad-dm-status').textContent = d.dm ? 'ON' : 'OFF';
    document.getElementById('ad-gc-status').textContent = d.gc ? 'ON' : 'OFF';
    toast('✅ ' + scope.toUpperCase() + ' ' + (d[scope] ? 'ON' : 'OFF'));
  } catch (e) {
    toast('❌ ' + e.message, 'error');
    loadAntiDelete();
  }
}

async function adAction(action) {
  try {
    const r = await fetch('/api/antidelete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: KEY, action })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Failed');
    toast('✅ ' + action.replace('_', ' ')); loadAntiDelete();
  } catch (e) { toast('❌ ' + e.message, 'error'); }
}

// ⭐ FIX: backend returns flat { gc, dm } not nested .settings
async function loadAntiDelete() {
  try {
    const r = await fetch('/api/antidelete?key=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (!d.success) return;
    document.getElementById('ad-dm').checked = !!d.dm;
    document.getElementById('ad-gc').checked = !!d.gc;
    document.getElementById('ad-dm-status').textContent = d.dm ? 'ON' : 'OFF';
    document.getElementById('ad-gc-status').textContent = d.gc ? 'ON' : 'OFF';
  } catch (e) {}
}

loadConfig(); loadAntilink(); loadAntiDelete();
function toggleTheme() { const root = document.documentElement; const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; root.setAttribute('data-theme', next); localStorage.setItem('theme', next); }
</script>
</body></html>
